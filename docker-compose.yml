services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lenny_assistant

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d lenny_assistant"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: lenny_backend

    environment:
      APP_ENV: development
      LOG_LEVEL: INFO

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/lenny_assistant

      DEFAULT_LLM_PROVIDER: ollama

      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b

      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2

      RETRIEVAL_TOP_K: 5
      RETRIEVAL_THRESHOLD: 0.45

    volumes:
      - ./data:/app/data:ro

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
